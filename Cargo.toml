[package]
name = "discv5"
authors = ["Sigma Prime <contact@sigmaprime.io>"]
edition = "2021"
version = "0.12.0"
description = "Implementation of the p2p discv5 discovery protocol"
license = "Apache-2.0"
repository = "https://github.com/sigp/discv5"
readme = "./README.md"
keywords = ["peer-to-peer", "libp2p", "networking", "discovery", "discv5"]
categories = ["network-programming", "asynchronous"]
exclude = [".gitignore", ".github/*"]

[dependencies]
enr = { version = "0.14.0", features = [
    "k256",
    "ed25519",
] }
tokio = { version = "1", features = ["net", "sync", "macros", "rt"] }
libp2p-identity = { version = "0.3", features = [
    "ed25519",
    "secp256k1",
], optional = true }
multiaddr = { version = "0.19", optional = true }
zeroize = { version = "1", features = ["zeroize_derive"] }
futures = "0.3"
uint = { version = "0.10", default-features = false }
alloy-rlp = { version = "0.3", default-features = true }
# This version must be kept up to date do it uses the same dependencies as ENR
hkdf = "0.13"
hex = "0.4"
fnv = "1"
arrayvec = "0.7"
rand = { version = "0.10", package = "rand" }
socket2 = "0.6"
smallvec = "1"
parking_lot = "0.12"
lazy_static = "1"
aes = "0.9"
ctr = "0.10"
aes-gcm = "0.11.1"
tracing = { version = "0.1", features = ["log"] }
hashlink = "0.12"
delay_map = "0.4"
more-asserts = "0.3"

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
if-addrs = "0.15"
quickcheck = "1.1"
rand_core = "0.10"
rand_xorshift = "0.5"
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
libp2p = ["dep:libp2p-identity", "dep:multiaddr"]
serde = ["enr/serde"]
